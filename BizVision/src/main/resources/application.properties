#下面这些内容是为了让MyBatis映射
#指定Mybatis的Mapper文件
mybatis.mapper-locations=classpath:mappers/*xml
#指定Mybatis的实体目录
mybatis.type-aliases-package=com.example.bizvision.mybatis.entity
# 应用服务 WEB 访问端口
server.port=8080

# 适用 Java 8/17 + Spring Boot 2.7.18；接入 MySQL 时删除此行
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration